events { worker_connections 1024; }
http {
    access_log off;
    server {
        listen 172.29.92.10:8080;
        listen [fd42:756e:6974:92::10]:8080;
        location /announce/ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_pass http://127.0.0.1:6969;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
